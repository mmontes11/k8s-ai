---
# Agent Router (formerly Envoy AI Gateway) control plane, per ADR-001.
# Installed in the ai tenant namespace; the CRDs must reconcile before the
# controller (ai-gateway-crds -> ai-gateway). The crds/ subdir layout mirrors
# the Envoy Gateway install in k8s-infrastructure PR #126.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway-crds
  namespace: ai
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-tenant-ai
    namespace: flux-system
  path: ./infrastructure/ai-gateway/crds
  prune: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway
  namespace: ai
spec:
  dependsOn:
    - name: ai-gateway-crds
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-tenant-ai
    namespace: flux-system
  path: ./infrastructure/ai-gateway
  prune: true
  timeout: 5m
---
# The AIGatewayRoute that serves the single OpenAI endpoint on the Envoy
# Gateway (LAB-364). No InferencePools or EPPs: the rules point at one
# AIServiceBackend per model server (ADR-0001 IMP-009). Ordering: the
# AIGatewayRoute needs its CRDs (ai-gateway-crds), the Agent Router
# control plane that reconciles it (ai-gateway), the Envoy Gateway data
# plane (parentRef, k8s-infrastructure) and the model server Services the
# Backend objects wrap (kserve-models, llamacpp).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway-aigatewayroutes
  namespace: ai
spec:
  dependsOn:
    - name: ai-gateway
    - name: ai-gateway-crds
    - name: envoy-gateway
      namespace: flux-system
    - name: kserve-models
    - name: llamacpp
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-tenant-ai
    namespace: flux-system
  path: ./infrastructure/ai-gateway/aigatewayroutes
  prune: true
  timeout: 5m
---
# Grafana dashboards for the ai tenant's AI gateway (LAB-365). The
# ConfigMaps are picked up by the kube-prometheus-stack Grafana sidecar
# (label grafana_dashboard=1, searchNamespace: monitoring) — same mechanism
# as the dashboards in k8s-infrastructure infrastructure/prometheus/dashboards.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: ai
spec:
  dependsOn:
    - name: prometheus
      namespace: flux-system
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-tenant-ai
    namespace: flux-system
  path: ./infrastructure/grafana-dashboards
  prune: true
  timeout: 5m
