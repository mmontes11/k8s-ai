apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode
data:
  # Useful context = tokens available before opencode auto-compacts the session.
  #
  # opencode (V2) checks, before each request is sent, whether the measured
  # prompt plus the estimated new text has reached:
  #   useful = window - buffer
  #   window = min(limit.input, limit.context)
  # An explicit buffer is honoured verbatim: a share of each model's window, so
  # one value fits every model. The 15%-at-least-16k default applies only when
  # no buffer is set. With "5%":
  #
  #   gemma4:26b-ctx256k      262144 - 13107 = 249037 (95.0%)
  #   qwen36:35b-ctx256k      262144 - 13107 = 249037 (95.0%)
  #   qwen38:27b-q4-ctx157k   160768 -  8038 = 152730 (95.0%)
  #   qwen38:27b-q5-ctx90k     92160 -  4608 =  87552 (95.0%)
  #
  # Is "5%" safe? Yes, per the v2.2.5 compaction implementation — although it
  # breaks the V1-era invariant limit.output <= buffer, which no longer holds:
  # * Compaction is preemptive: the measured prompt (llama.cpp reports usage)
  #   plus an estimate of the pending text is checked before each request, so
  #   the threshold-crossing request is normally never sent.
  # * Every request's max output is fit to the room left in the window (1%
  #   headroom, 15% estimate margin), so a single generation cannot overflow
  #   the llama.cpp slot; a reply starting in the last 5% is truncated
  #   (finish "length") instead of overflowing.
  # * If the estimate runs low and llama.cpp rejects a request as too long,
  #   auto compaction recovers once: it compacts, then retries the turn.
  # * The summary call is sized to the buffer-sized room (up to 8038 output
  #   tokens here, 4608 on the 90k model), and its history is progressively
  #   shortened, oldest tool output first, if it still would not fit.
  #
  # Trade-offs accepted: compaction now starts at 95% of every window instead
  # of the unset default's 85.0% / 85.0% / 85.0% / 82.2%, so the summary runs
  # on a tighter budget (at most the buffer-sized room), and long replies
  # beginning in the last 5% are capped at the room left. keep.tokens stays at
  # its 15000 default (recent conversation kept verbatim beside the summary).
  # experimental.background_compaction is left off: it is experimental, and
  # its held summaries are in-memory, lost on restart.
  # limit.output was raised 16384 -> 32768: with the <= buffer invariant gone,
  # the 16k cap only truncated long file writes; the window is still protected
  # by the dynamic output fit.
  #
  # limit.context must match ctx-size in infrastructure/llamacpp/llamacpp-configmap.yaml.
  # opencode cannot discover it: openai-compatible providers never query the endpoint.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "update": "disable",
      "permissions": [
        { "action": "shell", "resource": "*", "effect": "ask" },
        { "action": "shell", "resource": "cat *", "effect": "allow" },
        { "action": "shell", "resource": "grep *", "effect": "allow" },
        { "action": "shell", "resource": "git *", "effect": "allow" },
        { "action": "shell", "resource": "git commit *", "effect": "ask" },
        { "action": "shell", "resource": "git push *", "effect": "ask" },
        { "action": "shell", "resource": "rm *", "effect": "deny" },
        { "action": "shell", "resource": ":(){:|:&};:", "effect": "deny" },
        { "action": "external_directory", "resource": "*", "effect": "ask" },
        { "action": "edit", "resource": "*", "effect": "ask" },
        { "action": "read", "resource": "*", "effect": "allow" },
        { "action": "skill", "resource": "*", "effect": "allow" },
        { "action": "webfetch", "resource": "*", "effect": "allow" },
        { "action": "websearch", "resource": "*", "effect": "allow" }
      ],
      "model": "llama.cpp/qwen38:27b-q4-ctx157k",
      "agents": {
        "kubernetes": {
          "model": "llama.cpp/qwen38:27b-q4-ctx157k#kubernetes",
          "description": "Kubernetes expert with live cluster access via the Kubernetes MCP tools. Inspects cluster internals to troubleshoot workloads and reads CRD schemas to author accurate custom resources.",
          "system": "You are a Kubernetes expert. You have live, read access to a real Kubernetes cluster through the `kubernetes` MCP tools, and you always prefer looking at the cluster over guessing.\n\n## Knowledge Base\n\n* You have access to a local knowledge base restricted to the `~/code/knowledge-base/kubernetes` directory. You must strictly confine your searches and file reads to this folder.\n* This directory contains API references, release notes, and feature documentation for well-known Kubernetes projects.\n\n## Core principles\n\n* Never answer from memory about the state of the cluster. Query it.\n* Never invent API fields. Read the schema first.\n* Be explicit about namespace, apiVersion/kind, and resource names in everything you report or generate.\n* Distinguish clearly between what you observed in the cluster and what you are inferring or recommending.\n\n## Discovering the cluster\n\nUse the Kubernetes MCP tools to orient yourself before doing anything else:\n\n* List contexts and view the current configuration to confirm which cluster you are working against.\n* List namespaces and the resources relevant to the task.\n* Use the generic resource tools (list/get by apiVersion + kind) for anything that is not a core workload type, including all custom resources.\n* Read pod specs and status, container statuses, and pod logs (including previous containers when a pod is restarting).\n* Read events, scoped to the namespace or object in question, and read them early: they usually name the problem.\n* Use node information and metrics (node/pod resource usage, node stats) when the symptoms look like scheduling, capacity, eviction, or pressure issues.\n\n## Troubleshooting method\n\n1. **Establish the desired state:** read the object's spec.\n2. **Establish the actual state:** read its status, conditions, and the status of everything it owns (Deployment to ReplicaSet to Pod, StatefulSet to Pod to PVC, Service to EndpointSlice, and so on).\n3. **Correlate with events and logs:** find the first failure in the chain, not the last symptom.\n4. **Follow the ownership and dependency graph outwards when needed:** controllers and operators, RBAC, ServiceAccounts, ConfigMaps and Secrets, StorageClasses and PVs, webhooks, network policies, ingress and gateway objects, scheduling constraints (requests/limits, node selectors, affinity, taints and tolerations, topology spread, PodDisruptionBudgets).\n5. **State the root cause:** include the evidence for it, and a concrete remediation. If the evidence is inconclusive, say so and name the exact command or query that would settle it.\n6. **Pay particular attention to stateful workloads (databases, storage):** ordering guarantees, volume binding and expansion, data safety. Never propose an action that risks data loss without calling that risk out first.\n\n## Building custom resources\n\nWhen you are asked to write or fix a custom resource, do not rely on remembered API shapes. Inspect the CRD in the cluster:\n\n* List `apiextensions.k8s.io/v1` `CustomResourceDefinition` objects to find the CRD that backs the kind you need.\n* Get that CRD and read its `spec.versions[].schema.openAPIV3Schema` to learn the exact fields, nesting, types, enums, defaults, formats, and validation rules, and read `spec.versions[].served`/`storage` to pick the right apiVersion.\n* Honour `required` fields, respect enum values verbatim, and do not add fields that are absent from the schema. If the schema has `x-kubernetes-preserve-unknown-fields`, say so rather than assuming free-form input is intended.\n* Cross-check against real objects of the same kind already in the cluster: they show working conventions and how the controller populates status.\n* If the CRD is not installed, say that plainly instead of guessing the schema, and point out which operator provides it.\n\nEvery manifest you produce must be complete and applyable: correct apiVersion, kind, metadata (including namespace when the resource is namespaced), and a spec that validates against the CRD schema you read. Explain any field whose value is a judgement call.\n\n## Changing the cluster\n\nDefault to read-only investigation. Propose changes as manifests or exact commands for a human to review and apply, and mention the blast radius (restarts, rescheduling, downtime, data impact) before anything disruptive."
        }
      },
      "compaction": {
        "auto": true,
        "buffer": "5%"
      },
      "providers": {
        "llama.cpp": {
          "name": "Llama.cpp",
          "package": "aisdk:@ai-sdk/openai-compatible",
          "settings": {
            "baseURL": "http://llamacpp.ai.svc.cluster.local:8080/v1"
          },
          "models": {
            "gemma4:26b-ctx256k": {
              "name": "gemma4:26b-ctx256k",
              "limit": {
                "context": 262144,
                "input": 262144,
                "output": 32768
              },
              "capabilities": {
                "input": ["text", "image"],
                "output": ["text"]
              }
            },
            "qwen36:35b-ctx256k": {
              "name": "qwen36:35b-ctx256k",
              "limit": {
                "context": 262144,
                "input": 262144,
                "output": 32768
              }
            },
            "qwen38:27b-q4-ctx157k": {
              "name": "qwen38:27b-q4-ctx157k",
              "limit": {
                "context": 160768,
                "input": 160768,
                "output": 32768
              },
              "variants": [
                {
                  "id": "kubernetes",
                  "body": {
                    "temperature": 0.1
                  }
                }
              ]
            },
            "qwen38:27b-q5-ctx90k": {
              "name": "qwen38:27b-q5-ctx90k",
              "limit": {
                "context": 92160,
                "input": 92160,
                "output": 32768
              }
            }
          }
        }
      },
      "mcp": {
        "servers": {
          "github": {
            "type": "remote",
            "url": "http://mcp-github.ai.svc.cluster.local:8080/mcp",
            "oauth": false,
            "headers": {
              "Authorization": "Bearer {env:GITHUB_TOKEN}"
            },
            "disabled": false
          },
          "github-mariadb-operator": {
            "type": "remote",
            "url": "http://mcp-github.ai.svc.cluster.local:8080/mcp",
            "oauth": false,
            "headers": {
              "Authorization": "Bearer {env:GITHUB_TOKEN_MARIADB_OPERATOR}"
            },
            "disabled": false
          },
          "grafana": {
            "type": "remote",
            "url": "http://mcp-grafana.ai.svc.cluster.local:8000/mcp",
            "headers": {
              "Authorization": "Bearer {env:GRAFANA_MCP_TOKEN}"
            },
            "disabled": false
          },
          "kubernetes": {
            "type": "remote",
            "url": "http://mcp-kubernetes.ai.svc.cluster.local:8080/mcp",
            "disabled": false
          },
          "n8n": {
            "type": "remote",
            "url": "http://n8n-main.ai.svc.cluster.local:5678/mcp-server/http",
            "oauth": false,
            "headers": {
              "Authorization": "Bearer {env:N8N_TOKEN}"
            },
            "disabled": true
          },
          "photprism-mmontes": {
            "type": "remote",
            "url": "http://mcp-photoprism-mmontes.ai.svc.cluster.local:9001/mcp",
            "disabled": true
          },
          "photprism-xiaowen": {
            "type": "remote",
            "url": "http://mcp-photoprism-xiaowen.ai.svc.cluster.local:9001/mcp",
            "disabled": true
          }
        }
      }
    }
