apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: opencode
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy-internal
  hostnames:
    - "opencode.mmontes-internal.duckdns.org"
  rules:
    - backendRefs:
        - name: opencode
          port: 4096