apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: multica
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy-internal
  hostnames:
    - "multica.mmontes-internal.duckdns.org"
  rules:
    - backendRefs:
        - name: multica-frontend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: multica-api
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy-internal
  hostnames:
    - "multica-api.mmontes-internal.duckdns.org"
  rules:
    - backendRefs:
        - name: multica-backend
          port: 8080
