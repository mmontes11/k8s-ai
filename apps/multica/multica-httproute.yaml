apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: multica
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - "multica.mmontes-internal.duckdns.org"
    - "api.multica.mmontes-internal.duckdns.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: multica-frontend
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /uploads
        - path:
            type: PathPrefix
            value: /ws
        - path:
            type: PathPrefix
            value: /docs
      backendRefs:
        - name: multica-backend
          port: 8080
