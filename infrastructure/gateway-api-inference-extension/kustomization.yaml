# Gateway API Inference Extension (GAIE) CRDs, installed standalone from the
# upstream release so consumers (KServe LLMInferenceService, Envoy Gateway)
# share one owner instead of each chart vendoring its own copy.
# Same pattern as the `gateway-api` Kustomization in k8s-infrastructure.
#
# v1.5.0 is byte-identical to v1.5.0-rc.2, the release the kserve-llmisvc
# chart v0.21.0 previously vendored (createGIECRDs is now disabled there).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - https://github.com/kubernetes-sigs/gateway-api-inference-extension/config/crd?ref=v1.5.0
