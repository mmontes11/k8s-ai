apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma4-12b-nvfp4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: topolvm
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gemma4-12b-nvfp4
spec:
  baseRefs:
    - name: nvidia-template
  model:
    name: gemma4-12b-nvfp4
    uri: hf://unsloth/gemma-4-12b-it-NVFP4
  template:
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: gemma4-12b-nvfp4
    containers:
      - name: main
        # See:
        # https://docs.vllm.ai/en/stable/cli/serve/
        # https://huggingface.co/unsloth/gemma-4-12b-it-NVFP4
        # https://unsloth.ai/docs/models/gemma-4
        # https://unsloth.ai/docs/basics/nvfp4
        args:
          - --served-model-name=gemma4:12b-nvfp4
          - --reasoning-parser=gemma4
          - --enable-auto-tool-choice
          - --tool-call-parser=gemma4
          - --gpu-memory-utilization=0.92
          - --kv-cache-dtype=fp8
          - --max-num-seqs=1
          - --spec-method=mtp
          - --spec-model=google/gemma-4-12B-it-assistant
          - --spec-tokens=2
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma4-12b-nvfp4
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - gemma4-12b-nvfp4.mmontes-internal.duckdns.org
  rules:
    - backendRefs:
        - name: gemma4-12b-nvfp4-kserve-workload-svc
          port: 8000
