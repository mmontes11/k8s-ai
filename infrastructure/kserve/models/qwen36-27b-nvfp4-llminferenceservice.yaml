apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen36-27b-nvfp4
spec:
  baseRefs:
    - name: nvidia-template
  model:
    # The name clients send as "model", and the only place to set it: the presets
    # expand it into --served-model-name plus a "publishers/ai/models/<name>"
    # alias. Defaults to the resource name when omitted, which happens to be this
    # value anyway -- kept explicit so the API contract is visible in git.
    # uri is what actually resolves the weights.
    name: qwen36-27b-nvfp4
    uri: hf://nvidia/Qwen3.6-27B-NVFP4
  # Sized for a single RTX PRO 4000 SFF Blackwell (24 GiB), tuned to give the
  # KV cache as much of the card as possible. Text-only: image/video are
  # deliberately disabled to reclaim the vision tower (see
  # --language-model-only below).
  #
  # Memory budget. The checkpoint is 20.42 GiB, but not all of it is resident:
  #   -0.79 GiB  MTP head, only loaded with speculative decoding
  #   -0.86 GiB  vision tower, skipped by --language-model-only
  #   =18.77 GiB actually loaded (NVFP4 MLP + FP8 linear-attn projections
  #              + BF16 embeddings/lm_head)
  # At 0.97 utilization that leaves ~4.5 GiB, or ~3.2 GiB of cache pool once
  # CUDA context, activations and cudagraphs are paid for -- roughly double
  # what the previous 0.95 / vision-loaded / 4-slot config had.
  #
  # Nothing below sets the KV cache size -- it is not a tunable. vLLM takes
  # (24 GiB x gpu-memory-utilization) - weights - overhead and turns the
  # remainder into the cache pool, then reports at startup:
  #   "GPU KV cache size: N tokens"
  #   "Maximum concurrency for 32,768 tokens per request: X.XXx"
  # The second line is the one to read: how many full-length requests fit.
  #
  # Qwen3.6 is a hybrid model, so that pool holds two different things:
  #   - full attention KV, from 16 of the 64 layers: 4 kv heads x 256 head_dim
  #     => 32 KiB/token at fp8, i.e. 1 GiB for one full 32k sequence
  #   - gated DeltaNet (linear attention) recurrent + conv state, from the other
  #     48 layers: ~151 MiB *per sequence slot*, fp32, and length-independent
  # The DeltaNet state is charged per slot whether or not the slot is busy, so
  # slots and context are directly exchangeable: one slot costs ~151 MiB, which
  # is ~4.8k tokens of full-attention KV at fp8.
  template:
    # Persist the model instead of re-downloading it into an emptyDir on every
    # pod start. For hf:// URIs the controller mounts the model under a volume
    # named "kserve-provision-location" (constants.StorageInitializerVolumeName)
    # -- once at /mnt/models read-write for the storage-initializer init
    # container, then read-only for main -- and AddModelMount only creates its
    # own emptyDir when no volume of that name is already present. Declaring it
    # here therefore redirects the existing storage-initializer into the PVC;
    # the hf-hub ClusterStorageContainer and its HF_TOKEN keep working unchanged.
    #
    # This leans on an internal volume name rather than a documented API, so if
    # a KServe upgrade renames it the symptom is silent: an emptyDir reappears
    # and every restart re-downloads ~20 GiB. Check with
    #   kubectl -n ai get deploy -l app.kubernetes.io/name=qwen36-27b-nvfp4 \
    #     -o jsonpath='{..volumes[?(@.name=="kserve-provision-location")]}'
    #
    # See: https://github.com/kserve/kserve/blob/860120c2389e7c85cd7e50cbc6272338d5aa78e6/pkg/constants/constants.go#L210
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: kserve-models
    # The preset defines no pod-level securityContext, and a freshly provisioned
    # topolvm volume is root:root. CreateInitContainerWithConfig sets no
    # securityContext on the storage-initializer, so it runs as its image's USER
    # (1000) and could not otherwise write to the PVC. fsGroup makes kubelet chown
    # the mount to GID 1000; OnRootMismatch avoids re-chowning ~20 GiB per restart.
    #
    # Deliberately NO pod-level runAsUser here. Forcing uid 1000 onto the vLLM
    # container crashlooped it before it could parse a single flag:
    #   KeyError: 'getpwuid(): uid not found: 1000'
    #   torch/_inductor/runtime/cache_dir_utils.py -> default_cache_dir()
    #     -> getpass.getuser() -> pwd.getpwuid(os.getuid())
    # vllm/vllm-openai has no /etc/passwd entry for 1000, so any numeric uid
    # without one breaks getpass at import time -- and torch is not the only
    # library that resolves the current user that way. The image is built to run
    # as root (its config has no USER), so let it.
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    containers:
      - name: main
        # The preset sets runAsNonRoot: true, which suits its own
        # ghcr.io/llm-d/llm-d-cuda image but not the vllm/vllm-openai that
        # nvidia-template substitutes: kubelet refuses to start it with "container
        # has runAsNonRoot and image will run as root". Relax just that field --
        # strategic merge keeps the preset's readOnlyRootFilesystem, dropped
        # capabilities, seccompProfile and allowPrivilegeEscalation: false, so
        # this is uid 0 inside a container with no capabilities and no writable
        # root filesystem. As root, getpass resolves and torch's inductor cache
        # lands under /tmp, which the preset mounts as an emptyDir.
        securityContext:
          runAsNonRoot: false
        env:
          # Suggested by the OOM message itself. The failing load had 151 MiB
          # reserved-but-unallocated while needing 608 MiB, so fragmentation was
          # only a small part of the problem -- but expandable segments cost
          # nothing and this card has no slack to waste.
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
        # See:
        # https://docs.vllm.ai/en/stable/cli/serve/
        # https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4
        args:
          # No --served-model-name here on purpose: spec.model.name above is the
          # abstraction for it. The presets expand it in 16 places, including the
          # model-based routing header that kserve-config-llm-router-route matches
          # on ("publishers/<ns>/models/<name>"), and scaling.go uses it as the
          # WVA modelID. Overriding the flag directly would desynchronise vLLM's
          # accepted names from the router and the autoscaler.
          # From the model card, and confirmed by the checkpoint itself:
          # config.json carries quantization_config.quant_method: modelopt, and
          # hf_quant_config.json is modelopt-produced (producer.name: modelopt,
          # quant_algo MIXED_PRECISION -> W4A16_NVFP4 for the MLP, FP8 for the
          # linear-attn projections). This matches what auto-detect would pick,
          # so it is belt-and-braces rather than an override.
          #
          # Note discussions/6 suggests --quantization compressed-tensors. That
          # is wrong for this checkpoint: quantization_config borrows the
          # config_groups shape but declares quant_method: modelopt.
          - --quantization=modelopt
          # Also from the model card, and the functional counterpart to the
          # thinking handling in the llama.cpp preset: without it Qwen3.6's
          # reasoning tokens land in `content` instead of `reasoning_content`.
          - --reasoning-parser=qwen3
          # Parity with chat-template-kwargs in the llama.cpp preset. Qwen3.6
          # ships with preserve_thinking and it has to be opted into.
          - --default-chat-template-kwargs='{"preserve_thinking":true}'
          # Skip the vision tower entirely: frees 0.86 GiB straight into the
          # cache pool. This sets every modality limit to 0, and vLLM's
          # _mark_tower_model wraps the Qwen3_VisionTransformer in
          # no_init_weights when all of its modalities are 0, so the weights are
          # never loaded rather than merely unused. Drop this flag to restore
          # image/video at the cost of ~27k tokens of context.
          - --language-model-only
          # Fraction of TOTAL device memory the engine may claim. Note the card
          # reports 23.42 GiB to CUDA, not 24 -- the driver/ECC reserve the rest,
          # so every budget here is against 23.42.
          #
          # This does NOT cap weight loading; weights are allocated first and only
          # then is (total x util) - weights - overhead turned into the KV pool.
          # With weights this close to capacity the pool is whatever rounding is
          # left, so util is pushed high deliberately. If startup instead fails
          # with "Free memory on device (X/Y GiB) on startup is less than desired
          # GPU memory utilization", back off -- that check compares util against
          # free memory before the model loads.
          # 0.98 is the measured ceiling, not a preference. The driver holds
          # 23.42 - 22.98 = 0.44 GiB before vLLM starts, so 22.98/23.42 = 0.981 is
          # the most that can ever be requested. 0.99 failed the precondition:
          #   ValueError: Free memory on device cuda:0 (22.98/23.42 GiB) on startup
          #   is less than desired GPU memory utilization (0.99, 23.19 GiB).
          # Ignore vLLM's own suggestion to raise this to 0.9972 to offset CUDA
          # graph profiling -- that value is unreachable on this card.
          #
          # Margin at 0.98 is only ~30 MiB. The device plugin advertises
          # nvidia.com/gpu: 10 (time-slicing), so if another pod ever holds GPU
          # memory this check will fail rather than degrade. Drop to 0.95 if that
          # starts happening.
          - --gpu-memory-utilization=0.98
          # Pinned from a measured --max-model-len=-1 run, which auto-fit to
          # 28,224 tokens at util 0.98. Actual accounting from that boot:
          #   23.42 GiB  visible to CUDA
          #   x0.98      = 22.95 GiB budget
          #   -18.92 GiB weights ("Model loading took 18.92 GiB")
          #   -0.44 GiB  CUDA graphs (0.40 estimated, 0.44 actual)
          #   -~2.6 GiB  CUDA context, FlashInfer, Triton/FLA, activation peak
          #   = 1.03 GiB "Available KV cache memory" -> 28,224 tokens
          #
          # 24576 rather than the full 28,224: KV is paged at 1568 tokens here
          # (the hybrid allocator inflates the attention page to match the mamba
          # page size, so 28,224 is exactly 18 pages), and pinning the measured
          # maximum would make any growth in vLLM's runtime overhead a hard
          # startup failure on the next image bump. This leaves ~2 pages of slack.
          # Set -1 again after a major vLLM upgrade to re-measure.
          #
          # For reference, llama.cpp runs this model at ctx-size=131072 on this
          # same card, 4.6x more. Its Q4_K_XL GGUF is ~15.5 GiB against 18.92 GiB
          # here, and it does not pay vLLM's ~2.6 GiB of runtime overhead. The
          # NVFP4 checkpoint buys accuracy and spends it all on context.
          - --max-model-len=-1
          # Single client, so a single slot: ~151 MiB of DeltaNet state instead
          # of ~302 MiB at 2 or ~604 MiB at 4, all of which goes back to KV
          # (~4.8k tokens per slot). The tradeoff is that there is no batching
          # at all -- a second concurrent request waits for the first to finish
          # rather than interleaving -- which is the right call for one
          # interactive user, but raise this if an agent starts firing parallel
          # requests.
          - --max-num-seqs=1
          # Chunked prefill budget per engine step. Lower means a smaller
          # activation peak reserved during profiling, so more memory lands in
          # the pool; the cost is more chunks to ingest a long prompt.
          - --max-num-batched-tokens=2048
          # Halves full-attention KV to 32 KiB/token (from 64 KiB at bf16),
          # roughly doubling usable context. Not a gamble: the llama.cpp preset
          # for this model runs cache-type-k/v=q8_0, and the checkpoint itself
          # declares kv_cache_quant_algo: FP8 in hf_quant_config.json.
          - --kv-cache-dtype=fp8
          # Disables CUDA graphs. This exists purely to make MTP fit, and it is
          # the only lever left. The no-MTP boot measured, at util 0.98:
          #   22.95 budget - 18.92 weights - 0.44 cudagraphs - ~2.56 runtime
          #   = 1.03 GiB KV pool
          # The drafter needs ~0.9 GiB on top of that (see below), which leaves
          # roughly 0.1 GiB of pool -- not enough for a single page. Reclaiming the
          # 0.44 GiB the graphs occupy is what buys MTP a usable cache.
          #
          # The cost is real: no graph replay means per-step CPU launch overhead
          # returns, at max-num-seqs=1 where it is proportionally largest. MTP
          # reduces the number of steps and eager mode makes each step dearer, so
          # whether this is net faster than cudagraphs-without-MTP is an empirical
          # question -- benchmark both before settling.
          - --enforce-eager
          # MTP speculative decoding. Previously removed after it OOM'd:
          #   gpu_model_runner.py:5235  self.drafter.load_model(self.model)
          #   qwen3_5_mtp.py:224        self.lm_head = ParallelLMHead(...)
          #   torch.OutOfMemoryError: Tried to allocate 608.00 MiB. GPU 0 has a
          #   total capacity of 23.42 GiB of which 363.56 MiB is free.
          #
          # Note where the 608 MiB goes: Qwen3_5MTP builds its own ParallelLMHead
          # over the full 248320-token vocab rather than sharing the target's, so
          # the drafter costs meaningfully more than the 0.79 GiB the MTP tensors
          # occupy in the checkpoint.
          #
          # Re-enabled with --enforce-eager above paying for it. If this still
          # OOMs, MTP does not fit this checkpoint on 24 GiB and the choice is
          # MTP or context, not both.
          - --speculative-config='{"method":"mtp","num_speculative_tokens":2}'
          # 3 follows discussions/6 on the model repo (vLLM permits any multiple
          # of n_predict=1, warning that >1 reuses the same MTP layer and lowers
          # acceptance); llama.cpp uses spec-draft-n-max=2 for this model.
          #   https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4/discussions/6
          #
          # Correction to an earlier note here: MTP does NOT disable async
          # scheduling. The run above logged "Asynchronous scheduling is enabled."
          # with method=mtp active, so mtp is covered by the eagle-family
          # allowlist in VllmConfig.
          #
          # Also from that thread and deliberately omitted: moe_backend, a real
          # SpeculativeConfig field but inert for Qwen3.6-27B, which is dense.
---
# No Service here: the llmisvc controller already creates one, named
# kmeta.ChildName(<llmisvc name>, "-kserve-workload-svc"), with the same
# 8000->8000 http port and the same three-label selector a hand-written one would
# need. Its advantage is an ownerReference back to the LLMInferenceService, so it
# is garbage-collected with the model instead of lingering as Flux-owned state.
# See: pkg/controller/v1alpha2/llmisvc/workload.go
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen36-27b-nvfp4
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - qwen36-27b-nvfp4.mmontes-internal.duckdns.org
  rules:
    - backendRefs:
        - name: qwen36-27b-nvfp4-kserve-workload-svc
          port: 8000
