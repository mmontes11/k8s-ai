apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-nvfp4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: topolvm
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen38-27b-nvfp4
spec:
  baseRefs:
    - name: nvidia-template
  model:
    name: qwen38-27b-nvfp4
    uri: hf://unsloth/Qwen3.8-27B-NVFP4
  template:
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: qwen38-27b-nvfp4
    containers:
      - name: main
        # See:
        # https://docs.vllm.ai/en/stable/cli/serve/
        # https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
        # https://unsloth.ai/docs/models/qwen3.8
        args:
          - --served-model-name=qwen38-27b-nvfp4
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
          - --language-model-only
          - --gpu-memory-utilization=0.98
          - --max-model-len=4096
          - --max-num-seqs=1
          - --kv-cache-dtype=fp8
          # Minimize VRAM usage:
          - --compilation-config='{"cudagraph_mode":"NONE"}''
          - --max-num-batched-tokens=1024
          # -----------
          - --default-chat-template-kwargs='{"preserve_thinking":true,"reasoning_effort":"xhigh"}'
          # - --speculative-config='{"method":"mtp","num_speculative_tokens":2}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen38-27b-nvfp4
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - qwen38-27b-nvfp4.mmontes-internal.duckdns.org
  rules:
    - backendRefs:
        - name: qwen38-27b-nvfp4-kserve-workload-svc
          port: 8000
