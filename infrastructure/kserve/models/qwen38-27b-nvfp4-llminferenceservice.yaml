apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-nvfp4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: topolvm
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen38-27b-nvfp4
spec:
  baseRefs:
    - name: nvidia-template
  model:
    name: qwen38-27b-nvfp4
    uri: hf://unsloth/Qwen3.8-27B-NVFP4
  template:
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: qwen38-27b-nvfp4
    containers:
      - name: main
        # See:
        # https://docs.vllm.ai/en/stable/cli/serve/
        # https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
        # https://unsloth.ai/docs/models/qwen3.8
        args:
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
          - --language-model-only
          # Weights are 20.32Gi of the 23.42Gi card. Do NOT raise this: the KV
          # cache gets whatever budget is left over, but FlashInfer workspaces
          # and warmup activations are allocated *after* profiling and are not
          # accounted for. 0.98 left only 470Mi of slack and OOMed on warmup.
          - --gpu-memory-utilization=0.94
          - --max-model-len=-1
          - --max-num-seqs=1
          - --kv-cache-dtype=fp8
          - --default-chat-template-kwargs='{"preserve_thinking":true,"reasoning_effort":"xhigh"}'
          # Drafter does not fit in VRAM
          # - --speculative-config='{"method":"mtp","num_speculative_tokens":1}'
          # Minimize VRAM usage
          # - --compilation-config='{"cudagraph_mode":"NONE"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen38-27b-nvfp4
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - qwen38-27b-nvfp4.mmontes-internal.duckdns.org
  rules:
    - backendRefs:
        - name: qwen38-27b-nvfp4-kserve-workload-svc
          port: 8000
