apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-27b-nvfp4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: topolvm
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen-27b-nvfp4
spec:
  baseRefs:
    - name: nvidia-template
  model:
    name: qwen-27b-nvfp4
    uri: hf://nvidia/Qwen3.6-27B-NVFP4
  template:
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: qwen-27b-nvfp4
    containers:
      - name: main
        # See:
        # https://docs.vllm.ai/en/stable/cli/serve/
        # https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4
        args:
          - --served-model-name=qwen-27b-nvfp4
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
          - --default-chat-template-kwargs='{"preserve_thinking":true}'
          - --language-model-only
          - --gpu-memory-utilization=0.98
          - --max-model-len=-1
          - --max-num-seqs=1
          - --kv-cache-dtype=fp8
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-27b-nvfp4
spec:
  parentRefs:
    - name: traefik-internal
      namespace: networking
  hostnames:
    - qwen-27b-nvfp4.mmontes-internal.duckdns.org
  rules:
    - backendRefs:
        - name: qwen-27b-nvfp4-kserve-workload-svc
          port: 8000
