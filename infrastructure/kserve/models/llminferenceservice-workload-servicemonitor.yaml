apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llminferenceservice-workload
spec:
  namespaceSelector:
    matchNames:
      - ai
  selector:
    matchLabels:
      app.kubernetes.io/component: llminferenceservice-workload
      app.kubernetes.io/part-of: llminferenceservice
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: false
