apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: hf-storage
spec:
  container:
    name: storage-initializer
    image: kserve/storage-initializer:v0.19.0
    imagePullPolicy: IfNotPresent
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: HF_TOKEN
          optional: false
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      runAsNonRoot: true
  supportedUriFormats:
    - prefix: hf://
  supportsMultiModelDownload: true
  workloadType: initContainer