apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-resources
spec:
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-resources
  interval: 10m
  values:
    kserve:
      createSharedResources: false
      llmisvc:
        controller:
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
            limits:
              # Set by the helm chart and enforced by kserve.
              # See: https://github.com/kserve/kserve/pull/6536
              cpu: 200m 
              memory: 300Mi
