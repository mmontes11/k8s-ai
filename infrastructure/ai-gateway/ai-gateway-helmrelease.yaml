apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: ai-gateway
  interval: 10m
  # CRDs are installed by the separate `ai-gateway-crds` Kustomization
  # (./crds); the controller chart ships no CRDs of its own, but Skip makes
  # the ownership explicit and matches the Envoy Gateway HelmRelease
  # (k8s-infrastructure PR #127).
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # The Envoy Gateway controller (LAB-362) runs in the dedicated
    # `envoy-internal` namespace (k8s-infrastructure #127), not the chart
    # default `envoy-gateway-system`. Keeps the chart's bundled
    # InferencePool ClusterRoleBinding pointed at the `envoy-gateway`
    # ServiceAccount where the controller actually runs (the chart
    # hardcodes that name; the RBAC is also owned by LAB-362 as a static
    # manifest — a Flux postRenderer can't strip chart-bundled objects).
    envoyGateway:
      namespace: envoy-internal
