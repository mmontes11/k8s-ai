apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: ai-gateway
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    controller:
      watch:
        namespaces:
          - envoy-internal
          - ai
    envoyGateway:
      namespace: envoy-internal
