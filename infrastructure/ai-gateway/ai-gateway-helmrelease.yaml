apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  # Shared Agent Router control plane in envoy-gateway-system alongside the
  # shared Envoy Gateway controller (LAB-385, k8s-infrastructure
  # design/adr-001): watch is unset, so the controller watches all
  # namespaces and its extproc webhook injects sidecars into Envoy proxies
  # in every tenant namespace.
  targetNamespace: envoy-gateway-system
  chartRef:
    kind: OCIRepository
    name: ai-gateway
  interval: 10m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # Namespace of the shared Envoy Gateway controller (k8s-infrastructure);
    # the chart's InferencePool ClusterRoleBinding grants it to that
    # controller's envoy-gateway ServiceAccount.
    envoyGateway:
      namespace: envoy-gateway-system
