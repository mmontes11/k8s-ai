# Envoy Gateway Backend wrapping the gemma4-12b-nvfp4 vLLM Service
# (LAB-364, ADR-0001 IMP-009).
#
# AIServiceBackend only accepts a Backend resource of the Envoy Gateway as
# backendRef (a plain k8s Service is not supported yet — upstream tracking
# issue envoyproxy/ai-gateway#902), so the KServe workload Service is
# wrapped here. The FQDN endpoint form is the only endpoint type the
# Backend CRD supports in EG v1.9.x (no Service backendRef); STRICT_DNS
# keeps resolving the ClusterIP while the model is not ready, so a
# scaled-down vLLM simply 503s until it warms up. Port 8000 is vLLM's
# OpenAI API port — the same one the legacy traefik HTTPRoute routes to.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: gemma4-12b-nvfp4
spec:
  endpoints:
    - fqdn:
        hostname: gemma4-12b-nvfp4-kserve-workload-svc.ai.svc.cluster.local
        port: 8000
