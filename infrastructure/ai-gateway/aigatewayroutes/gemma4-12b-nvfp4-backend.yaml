# Envoy Gateway Backend wrapping the gemma4-12b-nvfp4 standalone EPP
# Service (LAB-364 chart evaluation — standalone mode).
#
# AIServiceBackend only accepts a Backend resource of the Envoy Gateway as
# backendRef (a plain k8s Service is not supported yet — upstream tracking
# issue envoyproxy/ai-gateway#902), so the standalone chart's EPP Service
# (ClusterIP, entrypoint port 8081 of the bundled Envoy sidecar proxy) is
# wrapped here. The FQDN form mirrors the upstream
# examples/basic/basic.yaml. Port 8081 is the proxy entrypoint: the
# sidecar does the ext_proc endpoint picking and forwards to the chosen
# vLLM pod, so the Backend never talks to the vLLM pods directly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: gemma4-12b-nvfp4
spec:
  endpoints:
    - fqdn:
        hostname: gemma4-12b-nvfp4-epp.ai.svc.cluster.local
        port: 8081
