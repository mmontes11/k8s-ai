apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ai-inference.yaml
  # One AIServiceBackend + Envoy Gateway Backend pair per model server
  # (LAB-364, ADR-0001 IMP-009): the AIGatewayRoute rules reference the
  # AIServiceBackends, each wrapping its model Service through a Backend.
  - qwen38-27b-nvfp4-backend.yaml
  - qwen38-27b-nvfp4-aiservicebackend.yaml
  - gemma4-12b-nvfp4-backend.yaml
  - gemma4-12b-nvfp4-aiservicebackend.yaml
  - llamacpp-backend.yaml
  - llamacpp-aiservicebackend.yaml
