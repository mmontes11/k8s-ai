apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: llamacpp
spec:
  endpoints:
    - fqdn:
        hostname: llamacpp.ai.svc.cluster.local
        port: 8080
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llamacpp
spec:
  schema:
    name: OpenAI
  backendRef:
    name: llamacpp
    kind: Backend
    group: gateway.envoyproxy.io
