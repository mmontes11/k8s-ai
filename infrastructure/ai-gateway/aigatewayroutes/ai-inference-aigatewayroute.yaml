apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ai-inference
spec:
  hostnames:
    - mmontes-llm.duckdns.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-internal
      sectionName: https
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen38:27b-nvfp4
      backendRefs:
        - name: qwen38-27b-nvfp4
      timeouts:
        request: 10m
      modelsOwnedBy: vllm
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: gemma4:12b-nvfp4
      backendRefs:
        - name: gemma4-12b-nvfp4
      timeouts:
        request: 10m
      modelsOwnedBy: vllm
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: gemma4:26b-ctx256k
      backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
      modelsOwnedBy: llamacpp
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen3-coder:30b-instruct
      backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen3-vl:30b-instruct
      backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
      modelsOwnedBy: llamacpp
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen38:27b-q4-ctx157k
      backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
      modelsOwnedBy: llamacpp
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen38:27b-q5-ctx90k
      backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
      modelsOwnedBy: llamacpp
    # Fallback: any model name not matched above still reaches the llama.cpp
    # router (its own model-not-found error beats the gateway's 404); it is
    # not advertised in /v1/models.
    - backendRefs:
        - name: llamacpp
      timeouts:
        request: 10m
      modelsOwnedBy: llamacpp
