# Envoy Gateway Backend wrapping the gemma4-12b-nvfp4 vLLM Service
# (LAB-364, ADR-0001 IMP-009).
#
# AIServiceBackend only accepts a Backend resource of the Envoy Gateway as
# backendRef (a plain k8s Service is not supported yet — upstream tracking
# issue envoyproxy/ai-gateway#902), so the KServe workload Service is
# wrapped here. The FQDN endpoint form is the only endpoint type the
# Backend CRD supports in EG v1.9.x (no Service backendRef); STRICT_DNS
# keeps resolving the ClusterIP while the model is not ready, so a
# scaled-down vLLM simply 503s until it warms up. Port 8000 is vLLM's
# OpenAI API port — the same one the legacy traefik HTTPRoute routes to.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: gemma4-12b-nvfp4
spec:
  # Plain-HTTP backend (no TLS certificates, LAB-374): spec.tls is
  # intentionally unset, so Envoy Gateway opens a plaintext connection and
  # performs no certificate verification. Do not add
  # spec.tls.insecureSkipVerify — in EG v1.9.x any spec.tls on a Backend
  # makes Envoy TLS-handshake the upstream, which this backend rejects.
  endpoints:
    - fqdn:
        hostname: gemma4-12b-nvfp4-kserve-workload-svc.ai.svc.cluster.local
        port: 8000
---
# AIServiceBackend for the gemma4:12b-nvfp4 rule of the ai-inference
# AIGatewayRoute (LAB-364, ADR-0001 IMP-009).
#
# The rule matches x-ai-eg-model: gemma4:12b-nvfp4 (the vLLM
# --served-model-name, set from the request body's `model` field by the
# Agent Router filter) and routes to this backend, which wraps the vLLM
# Service through the Backend document above (the backendRef must be an
# Envoy Gateway Backend — schema-enforced on AIServiceBackendSpec).
#
# schema.name: OpenAI is the request/response contract the Agent Router
# expects from this backend — the vLLM workload speaks OpenAI natively, so
# no translation happens (same contract as the route's own schema).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: gemma4-12b-nvfp4
spec:
  schema:
    name: OpenAI
  backendRef:
    name: gemma4-12b-nvfp4
    kind: Backend
    group: gateway.envoyproxy.io
