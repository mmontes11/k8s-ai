# Agent Router (ai-gateway-helm) controller values — LAB-363.
#
# Only one non-default value for the homelab layout:
#   - envoyGateway.namespace: the Envoy Gateway data plane (LAB-362) installs
#     into the `ai` tenant namespace (2026-10-31 namespace decision), not the
#     chart default `envoy-gateway-system`.
#
# The chart bundles an InferencePool ClusterRole + ClusterRoleBinding
# (templates/envoy_gateway_cluster_role_for_inference_pool.yaml) so the
# `envoy-gateway` ServiceAccount can read InferencePools. That RBAC is owned
# by LAB-362 (the Envoy Gateway + GAIE install) — this PR deliberately does
# NOT add its own static copy (see the k8s-infrastructure PR #126 overlap).
# A Flux HelmRelease postRenderer cannot strip chart-bundled objects, so this
# value keeps the chart's bundled binding pointed at the namespace the Envoy
# Gateway actually runs in instead of a dangling default; LAB-362 and this
# release must converge on a single owner for the InferencePool RBAC.
envoyGateway:
  namespace: ai
