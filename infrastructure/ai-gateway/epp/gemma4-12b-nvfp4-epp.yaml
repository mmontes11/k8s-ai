# EPP for the gemma4-12b-nvfp4 InferencePool (LAB-364). One replica: the
# pool is small and the EPP is a stateless ext_proc side of the data path,
# so no leader election. Image pinned to a release tag (v1.0.0), not :main.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma4-12b-nvfp4-epp-plugins
data:
  epp-plugins.yaml: |
    # Load-aware scheduling for vLLM: the metrics data source
    # (auto-injected by llm-d-router v1.0.0 when no data layer is
    # specified) scrapes the workload's Prometheus /metrics endpoint and
    # the queue-depth, KV-cache-utilization and prefix-cache scorers rank
    # candidates (same plugin set as the upstream examples).
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: queue-scorer
          - pluginRef: kv-cache-utilization-scorer
          - pluginRef: prefix-cache-scorer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemma4-12b-nvfp4-epp
  labels:
    app: gemma4-12b-nvfp4-epp
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-12b-nvfp4-epp
  labels:
    app: gemma4-12b-nvfp4-epp
spec:
  selector:
    app: gemma4-12b-nvfp4-epp
  ports:
    - protocol: TCP
      port: 9002
      targetPort: 9002
      name: grpc
      # Envoy speaks HTTP/2 to the ext_proc endpoint picker.
      appProtocol: http2
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-12b-nvfp4-epp
  labels:
    app: gemma4-12b-nvfp4-epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma4-12b-nvfp4-epp
  template:
    metadata:
      labels:
        app: gemma4-12b-nvfp4-epp
    spec:
      serviceAccountName: gemma4-12b-nvfp4-epp
      # Conservatively mirrors the longest grace period of the pods
      # within the pool (upstream recommendation).
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - gemma4-12b-nvfp4
            - --pool-namespace
            - ai
            - --v
            - "4"
            - --zap-encoder
            - json
            - --grpc-port
            - "9002"
            - --grpc-health-port
            - "9003"
            - --config-file
            - /config/epp-plugins.yaml
          ports:
            - containerPort: 9002
              name: grpc
            - containerPort: 9003
              name: health
            - containerPort: 9090
              name: metrics
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: plugins-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: plugins-config
          configMap:
            name: gemma4-12b-nvfp4-epp-plugins
