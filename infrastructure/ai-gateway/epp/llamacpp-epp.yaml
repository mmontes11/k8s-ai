# EPP for the llamacpp InferencePool (LAB-364). One replica: the pool is
# small and the EPP is a stateless ext_proc side of the data path, so no
# leader election. Image pinned to a release tag (v1.0.0), not :main.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-epp-plugins
data:
  epp-plugins.yaml: |
    # No metrics data source: the EPP must not scrape the router's
    # /metrics. llm-d-router v1.0.0 auto-injects one into every
    # configuration (pkg/epp/config/loader/defaults.go) unless
    # dataLayer.injectDefaults is set to false, so it is spelled out.
    # The router's /metrics requires a model name (a bare scrape returns
    # 400), and a random pick among the pool's members is the right
    # policy for a single-router deployment.
    #
    # Sleep note: upstream llama.cpp guarantees that scraping /metrics
    # never wakes a sleeping model instance (test_server_sleep_read_only_endpoints),
    # so the default data source would have been safe too; skipping it
    # keeps the probe surface at zero.
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
      - type: single-profile-handler
      - type: random-picker
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: random-picker
    dataLayer:
      injectDefaults: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llamacpp-epp
  labels:
    app: llamacpp-epp
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-epp
  labels:
    app: llamacpp-epp
spec:
  selector:
    app: llamacpp-epp
  ports:
    - protocol: TCP
      port: 9002
      targetPort: 9002
      name: grpc
      # Envoy speaks HTTP/2 to the ext_proc endpoint picker.
      appProtocol: http2
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-epp
  labels:
    app: llamacpp-epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamacpp-epp
  template:
    metadata:
      labels:
        app: llamacpp-epp
    spec:
      serviceAccountName: llamacpp-epp
      # Conservatively mirrors the longest grace period of the pods
      # within the pool (upstream recommendation).
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - llamacpp
            - --pool-namespace
            - ai
            - --v
            - "4"
            - --zap-encoder
            - json
            - --grpc-port
            - "9002"
            - --grpc-health-port
            - "9003"
            - --config-file
            - /config/epp-plugins.yaml
          ports:
            - containerPort: 9002
              name: grpc
            - containerPort: 9003
              name: health
            - containerPort: 9090
              name: metrics
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: plugins-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: plugins-config
          configMap:
            name: llamacpp-epp-plugins
