# qwen38-27b-nvfp4 EPP + InferencePool via the llm-d-router-gateway chart
# (LAB-364 chart evaluation — gateway mode).
#
# Release name = pool name = model name, so the chart renders:
#   InferencePool  qwen38-27b-nvfp4  (selector = the KServe workload pod,
#                                     endpointPickerRef -> <release>-epp:9002)
#   Deployment     qwen38-27b-nvfp4-epp
#   Service        qwen38-27b-nvfp4-epp  (9002 grpc-ext-proc, 9090 metrics)
#   RBAC           SA + roles for pool/pod watching and auth reviews
#
# Values that intentionally differ from the chart defaults:
#   router.modelServers.* — the KServe workload pod labels and vLLM port,
#     same selector the hand-written pool used.
#   router.inferencePool.failureMode: FailOpen — if the EPP goes away,
#     GAIE load-balances the pool pods directly instead of failing closed
#     (the hand-written pool had no failureMode at all).
#   router.epp.image — pinned to the v1.0.0 release tag; the chart default
#     tracks main.
#   router.epp.resources — homelab-sized requests; the chart default
#     (4 CPU / 8 Gi requests, 16 Gi limits) does not apply. limits: null
#     reproduces the hand-written EPP (requests only); an empty map would
#     not work because Helm merges maps key-by-key and the 16 Gi limit
#     default would survive.
#   httpRoute.create: false (also the default) — routing is owned by the
#     AIGatewayRoute (../aigatewayroutes), not the chart's bundled route.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qwen38-27b-nvfp4-epp
spec:
  interval: 10m
  chart:
    spec:
      chart: llm-d-router-gateway
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: llm-d-router
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    router:
      modelServers:
        matchLabels:
          app.kubernetes.io/name: qwen38-27b-nvfp4
          app.kubernetes.io/part-of: llminferenceservice
          kserve.io/component: workload
        type: vllm
        protocol: http
        targetPorts:
          - number: 8000
      inferencePool:
        create: true
        failureMode: FailOpen
      epp:
        image:
          registry: ghcr.io/llm-d
          repository: llm-d-router-endpoint-picker
          tag: v1.0.0
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits: null
