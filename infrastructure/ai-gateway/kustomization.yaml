apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Agent Router control plane lives with the Envoy Gateway controllers in
# envoy-gateway-system; tenant namespaces hold only data-plane resources (LAB-385).
namespace: envoy-gateway-system
resources:
  - ai-gateway-controller-servicemonitor.yaml
  - ai-gateway-helmrelease.yaml
  - ai-gateway-ocirepository.yaml
