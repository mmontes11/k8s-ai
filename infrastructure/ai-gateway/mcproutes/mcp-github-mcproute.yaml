apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-github
spec:
  hostnames:
    - mcp.mmontes-internal.duckdns.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-internal
      sectionName: https
  path: /github
  backendRefs:
    - name: mcp-github
      port: 8080
      path: /mcp
      forwardHeaders:
        - name: Authorization
