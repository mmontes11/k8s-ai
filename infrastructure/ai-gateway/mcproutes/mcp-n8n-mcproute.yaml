apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-n8n
spec:
  hostnames:
    - mmontes-llm.duckdns.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-internal
      sectionName: https
  path: /mcp/n8n
  backendRefs:
    - name: n8n-main
      port: 5678
      path: /mcp-server/http
      forwardHeaders:
        - name: Authorization
