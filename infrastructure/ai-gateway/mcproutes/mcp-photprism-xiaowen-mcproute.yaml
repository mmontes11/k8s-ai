# MCPRoute: `photprism-xiaowen` MCP server — LAB-377.
#
# No client authentication: opencode sends no headers for it, so there is
# no forwardHeaders.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-photprism-xiaowen
spec:
  hostnames:
    - mmontes-llm.duckdns.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-internal
      sectionName: websecure
  path: /mcp/photprism-xiaowen
  backendRefs:
    - name: mcp-photoprism-xiaowen
      port: 9001
      path: /mcp
