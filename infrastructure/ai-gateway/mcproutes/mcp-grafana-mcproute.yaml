apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-grafana
spec:
  hostnames:
    - mmontes-llm.duckdns.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-internal
      sectionName: https
  path: /mcp/grafana
  backendRefs:
    - name: mcp-grafana
      port: 8000
      path: /mcp
      forwardHeaders:
        - name: Authorization
