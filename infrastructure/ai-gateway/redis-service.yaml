# Redis backing the Envoy Gateway token rate limiting
# (config.envoyGateway.rateLimit in envoy-gateway-values.yaml).
# Adapted from theagentrouter/agent-router
# examples/token_ratelimit/redis.yaml: deployed into `ai` instead of
# `redis-system` (everything in this stack lives in the `ai` tenant).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  ports:
    - name: redis
      port: 6379
  selector:
    app: redis
