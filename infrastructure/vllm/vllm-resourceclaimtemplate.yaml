# DRA claim template for the vllm serving-engine Deployment (LAB-399).
# The vllm-stack chart (0.1.10) has no DRA values, so the claim wiring is
# injected into the rendered pod template via the HelmRelease postRenderers.
# The NVIDIA DRA driver publishes 8 consumable shares per GPU (see the
# gpu-operator HelmRelease in mmontes11/k8s-infrastructure, LAB-398); a claim
# without a capacity request consumes 1 share, so up to 8 workloads share the
# GPU concurrently via CUDA time-slicing (compute mode DEFAULT) - equivalent
# to the old device-plugin time-slicing.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: vllm-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
